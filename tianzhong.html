  if (!key){ panel.classList.remove('open'); try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {} return; }
  fillPanel(key);
  try { history.replaceState(null, '', '#' + (key.endsWith('里') ? encodeURIComponent(key) : key)); } catch (e) {}
  panel.classList.add('open');
  let tgt, dist;
  if (key === 'route'){ const a = at(RLEN * .5); tgt = a.p; dist = 24; }
  else if (key === 'tianwei'){ tgt = new THREE.Vector3(CX - 8, 0, CZ - 4); dist = 24; }
  else if (ANCH[key]){ tgt = new THREE.Vector3(ANCH[key][0], 0, ANCH[key][1]); dist = key === 'dashe' || key === 'funong' ? 8 : 9; }
  else if (byName[key]){ tgt = byName[key].pos; dist = clamp(byName[key].r * 7 + 9, 11, 18); }
  if (tgt){ goalTarget.copy(tgt); goalDist = Math.min(dist, defaultDist() * .8); tweening = true; controls.autoRotate = false; }
}
$('closeBtn').onclick = () => select(null);
$('resetBtn').onclick = resetView;
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
const nightBtn = $('nightBtn');
function setNightLabel(){ nightBtn.innerHTML = nightGoal ? `☀️ <span class="lbl">${tr('day')}</span>` : `🌙 <span class="lbl">${tr('night')}</span>`; }
function setNight(on){ nightGoal = on ? 1 : 0; document.body.classList.toggle('night', on); nightBtn.setAttribute('aria-pressed', String(on)); setNightLabel(); }
nightBtn.onclick = () => setNight(!nightGoal);
function setNames(on){ showNames = on; $('namesBtn').setAttribute('aria-pressed', String(on)); for (const v of villages) chipEls[v.name].b.classList.toggle('off', !on); }
$('namesBtn').onclick = () => setNames(!showNames);
const zoomBy = f => { goalTarget.copy(controls.target); goalDist = clamp(camera.position.distanceTo(controls.target) * f, controls.minDistance, controls.maxDistance); tweening = true; controls.autoRotate = false; };
$('bZin').onclick = () => zoomBy(.7); $('bZout').onclick = () => zoomBy(1.45);
let azGoal = null, lastAz = 999; const tmpV = new THREE.Vector3(), tmpS = new THREE.Spherical(), compassEl = $('compass');
$('bNorth').onclick = () => { azGoal = 0; tweening = false; controls.autoRotate = false; };
function extraFrame(dt){
  if (azGoal !== null){ const off = tmpV.copy(camera.position).sub(controls.target), sp = tmpS.setFromVector3(off); let d = azGoal - sp.theta; d = ((d + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; sp.theta += d * Math.min(1, dt * 7); if (Math.abs(d) < .004){ sp.theta = azGoal; azGoal = null; } off.setFromSpherical(sp); camera.position.copy(controls.target).add(off); }
  const az = controls.getAzimuthalAngle(); if (Math.abs(az - lastAz) > .004){ lastAz = az; compassEl.style.transform = `rotate(${az}rad)`; }
}
const hintEl = $('hint'); let hintShown = false;
function hideHint(){ if (!hintShown) return; hintShown = false; hintEl.hidden = true; try { localStorage.setItem('tz-hint', '1'); } catch (e) {} }
renderer.domElement.addEventListener('pointerdown', hideHint);
setTimeout(() => { let seen = false; try { seen = localStorage.getItem('tz-hint') === '1'; } catch (e) {} if (seen || qs.has('shot') || selected) return; hintEl.textContent = tr('hint'); hintEl.hidden = false; hintShown = true; setTimeout(hideHint, 7000); }, 2500);
function applyLang(){
  const u = UI[LANG]; document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : LANG;
  $('tTitle').textContent = u.title; $('tSub').textContent = u.sub; $('nLbl').textContent = u.names; $('rLbl').textContent = u.reset; $('twLbl').textContent = u.tw; $('hLbl').textContent = u.home;
  $('namesBtn').title = u.tNames; nightBtn.title = u.tNight; $('resetBtn').title = u.tReset; $('twBtn').title = u.tTw; $('homeBtn').title = u.tHome;
  document.title = LANG === 'zh' ? '田中鎮 3D 地圖與 7 號公車｜Tianzhong × Bus 7' : u.title + ' | Tianzhong 3D map';
  setNightLabel(); renderNames(); renderCard(); if (selected) fillPanel(selected);
}
const langSel = $('langSel');
langSel.innerHTML = Object.entries(LANGS).map(([k, n]) => `<option value="${k}">${n}</option>`).join(''); langSel.value = LANG;
langSel.onchange = () => { LANG = langSel.value; try { localStorage.setItem('tw-lang', LANG); } catch (e) {} applyLang(); };
applyLang();
if (qs.has('night')) setNight(true);
if (qs.has('names')) setNames(true);

/* ================= 點選／懸停 ================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downX = 0, downY = 0, hoverKey = null;
function pick(e){ const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera); const hit = ray.intersectObjects(pickMeshes, false)[0]; return hit ? hit.object.userData.pick : null; }
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse'){ hoverKey = pick(e); stage.classList.toggle('hover', !!hoverKey); } });
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => { if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; const k = pick(e); if (k) select(k); });

/* ================= 主迴圈 ================= */
const tc = new THREE.Color();
function applyNight(n){
  scene.background.copy(DAY.bg).lerp(NIGHT.bg, n); scene.fog.color.copy(scene.background); ground.material.color.copy(DAY.ground).lerp(NIGHT.ground, n);
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n); sun.intensity = lerp(2.2, .8, n);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, n); hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, n); hemi.intensity = lerp(.95, 1.25, n);
  winMat.emissiveIntensity = .05 + n * 1.6; lampMat.emissiveIntensity = .1 + n * 2.5; routeLineMat.emissiveIntensity = .08 + n * .6; cloudMat.opacity = lerp(.9, .12, n);
  const ld = $('loading'); if (ld) ld.style.background = scene.background.getStyle();
}
const clock = new THREE.Clock(); let T = 0;
applyNight(0); resize(); resetView();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); T += dt; uTime.value = T;
  if (Math.abs(nightV - nightGoal) > .001){ nightV += (nightGoal - nightV) * Math.min(1, dt * 3); applyNight(nightV); }
  anim.forEach(f => f(T, dt));
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > CX + 34) c.position.x = CX - 34; });
  const sel = selected && (HOT[selected] ? selected : null), hovV = hoverKey && byName[hoverKey] ? hoverKey : null;
  for (const v of villages){ const on = v.name === selected || v.name === hovV || (selected === 'station' && v.name === '中路里') || (selected === 'hsr' && v.name === '龍潭里'); tc.set(0x2a3a10); v.topMat.emissive.lerp(on ? tc : new THREE.Color(0), Math.min(1, dt * 10)); }
  if (tweening){ const off = v3.copy(camera.position).sub(controls.target); controls.target.lerp(goalTarget, Math.min(1, dt * 3.2)); off.setLength(lerp(off.length(), goalDist, Math.min(1, dt * 3.2))); camera.position.copy(controls.target).add(off); }
  const W_ = innerWidth, H_ = innerHeight, narrow = W_ <= 760, open = panel.classList.contains('open');
  if (!narrow && open) camera.setViewOffset(W_, H_, W_ * .17, 0, W_, H_); else if (narrow && open) camera.setViewOffset(W_, H_, 0, H_ * .2, W_, H_); else if (camera.view) camera.clearViewOffset();
  if (!isFinite(camera.position.x + camera.position.y + camera.position.z)){ camera.position.set(CX, 0, CZ).add(startDir.clone().multiplyScalar(defaultDist() * 1.2)); controls.target.set(CX, 0, CZ); }
  extraFrame(dt); controls.update();
  for (const [k, c] of Object.entries(chipEls)){ if (c.b.classList.contains('off')){ continue; } tmp.set(c.anchor[0], c.y, c.anchor[1]).project(camera); c.b.classList.toggle('hidden', tmp.z > 1); c.b.style.transform = `translate(${(tmp.x * .5 + .5) * W_}px,${(-tmp.y * .5 + .5) * H_}px) translate(-50%,-100%)`; }
  renderer.render(scene, camera);
  if (T > .3 && !frame.done){ frame.done = true; $('loading').classList.add('done'); setTimeout(() => $('loading') && $('loading').remove(), 800); }
}
if (START_HASH && (PANEL[START_HASH] || DATA.li[START_HASH])) select(START_HASH);
frame();
if (qs.has('shot')){ document.body.classList.add('shot'); controls.autoRotate = false; clouds.forEach(c => c.visible = false); }
window.__tz = { select, setNight, setNames, scene, camera, controls, villages, bus, dbg: () => ({ goalDist, tweening, T, rlen: RLEN }) };
</script>
