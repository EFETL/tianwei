const VT = {
 '田尾村': {
  ja:'「田尾」という名は、八堡圳（はちほちゅう）の灌漑システムの下流に由来します。上流の人々が下流を「田尾」と呼んだのです。村には順安宮のほか、共生型の遊び場「怡心園」があり、滑り台、クライミングネット、ブランコがあります。',
  th:'ชื่อ "เทียนเหว่ย" มาจากปลายน้ำของระบบชลประทานคลองปาเป่า — คนที่อยู่ต้นน้ำเรียกปลายน้ำว่า "เทียนเหว่ย" ในหมู่บ้านมีศาลเจ้าซุ่นอัน (順安宮) และสนามเด็กเล่นสำหรับทุกคน “อี๋ซินหยวน” (怡心園) มีสไลเดอร์ ตาข่ายปีนป่าย และชิงช้า',
  id:'Nama "Tianwei" berasal dari hilir sistem irigasi Terusan Babao: orang di hulu menyebut hilir sebagai "Tianwei". Di desa ini ada Kuil Shun\'an dan taman bermain inklusif Yixinyuan (怡心園) dengan perosotan, jaring panjat, dan ayunan.',
  vi:'Cái tên "Tianwei" bắt nguồn từ hạ lưu hệ thống thủy lợi kênh Babao: người ở thượng nguồn gọi vùng hạ lưu là "Tianwei". Trong làng có đền Shun\'an và khu vui chơi hòa nhập Yixinyuan (怡心園) với cầu trượt, lưới leo và xích đu.',
  ko:'\'톈웨이\'라는 이름은 바바오(八堡) 수로 관개 시스템의 하류에서 왔습니다. 상류 사람들이 하류를 \'톈웨이\'라고 불렀습니다. 마을에는 순안궁과 함께 모두를 위한 놀이터 ‘이신위안’(怡心園)이 있어 미끄럼틀, 클라이밍 네트, 그네가 있습니다.',
  de:'„Tianwei“ stammt vom unteren Ende des Babao-Bewässerungskanals: Die Menschen flussaufwärts nannten das untere Ende „Tianwei“. Im Dorf stehen der Shun\'an-Tempel und der inklusive Spielplatz Yixinyuan (怡心園) mit Rutsche, Kletternetz und Schaukeln.' },
 '打簾村': {
  ja:'ハイウェイ・ガーデンのビジターセンターは打簾村にあります。100年以上前、打簾の人・巫修齊（ウー・シウチー）が漳州から花木の種や枝を持ち帰り、兄の巫規矩と一緒に植えたことが、田尾の花卉産業の始まりと伝えられています。',
  th:'ศูนย์บริการนักท่องเที่ยวของสวนดอกไม้ริมทางอยู่ในหมู่บ้านต่าเหลียน เล่ากันว่าเมื่อกว่า 100 ปีก่อน อู๋ซิวฉี ชาวต่าเหลียน นำเมล็ดและกิ่งพันธุ์ไม้ดอกกลับมาจากจางโจว แล้วปลูกร่วมกับพี่ชายอู๋กุยจวี่ ธุรกิจดอกไม้ของเทียนเหว่ยจึงเริ่มต้นขึ้น',
  id:'Pusat pengunjung Taman Bunga Jalan Raya berada di Desa Dalian. Konon, lebih dari 100 tahun lalu Wu Xiu-qi dari Dalian membawa pulang biji dan stek tanaman bunga dari Zhangzhou dan menanamnya bersama kakaknya, Wu Gui-ju — awal bisnis bunga Tianwei.',
  vi:'Trung tâm đón khách của Vườn hoa Quốc lộ nằm ở làng Dalian. Tương truyền hơn 100 năm trước, Wu Xiu-qi, người làng Dalian, mang hạt giống và cành giâm từ Zhangzhou về trồng cùng anh trai Wu Gui-ju — khởi đầu của nghề hoa Tianwei.',
  ko:'공로화원 방문자센터는 다롄촌에 있습니다. 100여 년 전 다롄 사람 우슈치가 장저우에서 꽃나무 씨앗과 가지를 가져와 형 우구이쥐와 함께 심었다고 전해지며, 이것이 톈웨이 꽃 산업의 시작입니다.',
  de:'Das Besucherzentrum des Highway Garden liegt in Dalian. Der Überlieferung nach brachte vor über 100 Jahren Wu Xiu-qi aus Dalian Samen und Stecklinge aus Zhangzhou mit und pflanzte sie mit seinem Bruder Wu Gui-ju — der Beginn von Tianweis Blumengeschäft.' },

  de:'Im Südwesten der Gemeinde gelegen, im Süden an die Stadt Beidou grenzend.' },
 '豐田村': {
  ja:'県の観光サイトは、豊田をハイウェイ・ガーデン周辺の村のひとつに挙げており、花で知られています。田尾郷は台湾最大のカーネーション産地です。',
  th:'เว็บท่องเที่ยวของเทศมณฑลจัดให้เฟิงเถียนเป็นหนึ่งในหมู่บ้านบริเวณสวนดอกไม้ริมทาง และขึ้นชื่อเรื่องดอกไม้ เทียนเหว่ยเป็นแหล่งปลูกคาร์เนชันใหญ่ที่สุดของไต้หวัน',
  id:'Situs wisata kabupaten mencantumkan Fengtian sebagai salah satu desa di kawasan Taman Bunga Jalan Raya, terkenal dengan bunga. Tianwei adalah daerah penghasil anyelir (carnation) terbesar di Taiwan.',
  vi:'Trang du lịch của huyện liệt kê Fengtian là một trong những làng thuộc khu Vườn hoa Quốc lộ, nổi tiếng về hoa. Tianwei là vùng trồng hoa cẩm chướng lớn nhất Đài Loan.',
  ko:'현(縣) 관광 사이트는 펑톈을 공로화원 일대의 마을 중 하나로 소개하며, 꽃으로 유명합니다. 톈웨이는 대만 최대의 카네이션 산지입니다.',
  de:'Die Tourismusseite des Landkreises führt Fengtian als eines der Dörfer im Gebiet des Highway Garden auf; es ist für Blumen bekannt. Tianwei ist Taiwans größtes Nelkenanbaugebiet.' },
 '溪頂村': {
  ja:'清水渓の上流側にあるため「溪頂」と呼ばれ、村に土の小山が多いことから「塗墩頭」（土の山の頭）の別名もあります。かつては三十張犂に属し、仁里・新厝とともに北玄宮の信仰圏に入っています。',
  th:'ชื่อ "ซีติ่ง" แปลว่า "เหนือลำธาร" เพราะอยู่เหนือแม่น้ำชิงสุ่ย และมีฉายาว่า "ถู๋ตุนโถว" (หัวเนินดิน) เพราะมีเนินดินมากมายในหมู่บ้าน ในอดีตเป็นส่วนหนึ่งของซานสือจางหลี๋ และอยู่ในเขตศรัทธาของศาลเจ้าเป่ยเสวียน ร่วมกับเหรินหลี่และซินชั่ว',
  id:'"Xiding" berarti "di atas sungai kecil" karena letaknya di hulu Sungai Qingshui. Desa ini berjuluk "Tudunton" (Kepala Gundukan) karena banyaknya gundukan tanah. Dahulu termasuk wilayah Sanshizhangli, dan bersama Renli serta Xincuo berada dalam lingkar pemujaan Kuil Beixuan.',
  vi:'"Xiding" nghĩa là "phía trên con suối" vì nằm ở thượng lưu sông Qingshui. Làng còn có biệt danh "Tudunton" (Đầu gò đất) vì có nhiều gò đất. Trước đây thuộc vùng Sanshizhangli, cùng Renli và Xincuo nằm trong vòng tín ngưỡng của đền Beixuan.',
  ko:'\'시딩\'은 칭수이(清水)강 위쪽에 있다는 뜻입니다. 마을에 흙 언덕이 많아 \'투둔터우\'(흙더미 머리)라고도 불립니다. 예전에는 싼스장리 지역에 속했으며, 런리·신춰와 함께 베이쉬안궁의 신앙권에 속합니다.',
  de:'„Xiding“ bedeutet „oberhalb des Baches“, denn das Dorf liegt am oberen Qingshui-Fluss. Wegen der vielen Erdhügel heißt es auch „Tudunton“ (Hügelkopf). Früher gehörte es zum Gebiet Sanshizhangli und zählt mit Renli und Xincuo zum Gläubigenkreis des Beixuan-Tempels.' },
 '新厝村': {
  ja:'彰化県で最も人口が少ない村のひとつで、住民は200人あまり。仁豊国民小学校があります。',
  th:'เป็นหนึ่งในหมู่บ้านที่มีประชากรน้อยที่สุดในเทศมณฑลจางฮั่ว มีผู้อยู่อาศัยเพียงสองร้อยกว่าคน โรงเรียนประถมเหรินเฟิงตั้งอยู่ที่นี่',
  id:'Salah satu desa berpenduduk paling sedikit di Kabupaten Changhua, hanya sedikit di atas 200 jiwa. SD Renfeng berada di sini.',
  vi:'Một trong những làng ít dân nhất huyện Changhua, chỉ hơn 200 người. Trường tiểu học Renfeng nằm ở đây.',
  ko:'창화현에서 인구가 가장 적은 마을 중 하나로 주민은 200여 명입니다. 런펑 초등학교가 이곳에 있습니다.',
  de:'Eines der einwohnerärmsten Dörfer im Landkreis Changhua, mit nur etwas über 200 Einwohnern. Die Grundschule Renfeng liegt hier.' },
 '仁里村': {
  ja:'北玄宮は玄天上帝をまつり、宮内には三将爺も祀られています。メディアでは「廟の中の廟」と呼ばれています。',
  th:'ศาลเจ้าเป่ยเสวียน (北玄宮) บูชาเสวียนเทียนซั่งตี้ และภายในยังประดิษฐานซานเจียงเหย (三將爺) สื่อเรียกว่า "ศาลในศาล"',
  id:'Kuil Beixuan memuliakan Xuantian Shangdi dan di dalamnya juga disemayamkan Tiga Jenderal (Sanjiang Ye) — oleh media disebut "kuil di dalam kuil".',
  vi:'Đền Beixuan thờ Huyền Thiên Thượng Đế (Xuantian Shangdi), bên trong còn thờ Tam Tướng Gia (Sanjiang Ye); báo chí gọi là "đền trong đền".',
  ko:'베이쉬안궁은 쉬안톈상디(玄天上帝)를 모시고, 궁 안에 싼장예(三將爺)도 모십니다. 언론은 이를 \'사당 속의 사당\'이라고 부릅니다.',
  de:'Der Beixuan-Tempel ist Xuantian Shangdi geweiht und beherbergt zudem die drei Generäle (Sanjiang Ye) – von der Presse ein „Tempel im Tempel“ genannt.' },
 '柳鳳村': {
  ja:'郷公所の公式サイトのグルメページに、柳鳳路にある庭園レストラン「阿嬤私房菜」（おばあちゃんの家庭料理）が載っています。',
  th:'หน้าอาหารของเว็บไซต์ที่ว่าการอำเภอระบุร้านอาหารสวน "อาหม่าซือฝางไช่" (ครัวคุณยาย) บนถนนหลิ่วเฟิง',
  id:'Halaman kuliner situs kantor kecamatan mencantumkan restoran taman "Grandma\'s Kitchen" (A-ma Sifang Cai) di Jalan Liufeng.',
  vi:'Trang ẩm thực trên website văn phòng hương liệt kê nhà hàng sân vườn "Bếp của Bà" (A-ma Sifang Cai) trên đường Liufeng.',
  ko:'향공소 공식 사이트의 맛집 페이지에는 류펑로에 있는 정원 식당 \'할머니의 부엌\'(아마스팡차이)이 올라 있습니다.',
  de:'Auf der Gastronomie-Seite des Gemeindeamts ist das Gartenrestaurant „Omas Küche“ (A-ma Sifang Cai) in der Liufeng-Straße aufgeführt.' },
 '陸豐村': {
  ja:'陸豊と海豊はもともと合わせて「海豊崙」と呼ばれ、先人は広東省恵州府の海豊県から来ました。村人は花卉・野菜・稲作などの農業が中心で、陸豊国民小学校もあります。2011年に天寿宮を陸豊の村廟とすることが取り決められました。',
  th:'ลู่เฟิงกับไห่เฟิงเดิมเรียกรวมกันว่า "ไห่เฟิงหลุน" บรรพบุรุษมาจากอำเภอไห่เฟิง เมืองฮุ่ยโจว มณฑลกวางตุ้ง ชาวบ้านทำเกษตร ปลูกดอกไม้ ผัก และข้าวเป็นหลัก โรงเรียนประถมลู่เฟิงก็ตั้งอยู่ที่นี่ ในปี 2011 มีมติให้ศาลเจ้าเทียนโส่ว (天壽宮) เป็นศาลประจำหมู่บ้านของลู่เฟิง',
  id:'Lufeng dan Haifeng dahulu bersama-sama disebut "Haifenglun"; leluhurnya berasal dari Kabupaten Haifeng, Prefektur Huizhou, Guangdong. Warga bertani bunga, sayur, dan padi; SD Lufeng juga berada di sini; pada 2011 disepakati Kuil Tianshou sebagai kuil desa Lufeng.',
  vi:'Lufeng và Haifeng trước đây được gọi chung là "Haifenglun"; tổ tiên đến từ huyện Haifeng, phủ Huizhou, Quảng Đông. Dân làng làm nông nghiệp: hoa, rau, lúa; trường tiểu học Lufeng cũng ở đây; năm 2011 đền Tianshou được thống nhất là đền làng của Lufeng.',
  ko:'루펑과 하이펑은 원래 합쳐서 \'하이펑룬\'이라 불렸으며, 선조들은 광둥성 후이저우부 하이펑현에서 왔습니다. 주민들은 꽃, 채소, 벼농사 등 농업을 주로 하며, 루펑 초등학교도 이곳에 있습니다. 2011년 톈서우궁을 루펑의 마을 사당으로 정하기로 합의했습니다.',
  de:'Lufeng und Haifeng hießen früher zusammen „Haifenglun“; die Vorfahren stammen aus dem Kreis Haifeng in Huizhou, Guangdong. Die Dorfbewohner betreiben Landwirtschaft – Blumen, Gemüse, Reis; auch die Grundschule Lufeng liegt hier; 2011 wurde der Tianshou-Tempel als Dorftempel von Lufeng vereinbart.' },
 '海豐村': {
  ja:'郷内で最も面積の大きい村。沛霖宮は三山国王をまつり、1889年の創建です。海豊崙一帯の路地は壁画で彩られ、「海豊崙ペイント村」と呼ばれています。',
  th:'เป็นหมู่บ้านที่มีพื้นที่ใหญ่ที่สุดในอำเภอ ศาลเจ้าเพ่ยหลิน (沛霖宮) บูชาซานซานกั๋วหวาง (三山國王) สร้างเมื่อปี 1889 ตรอกซอกซอยบริเวณไห่เฟิงหลุนเต็มไปด้วยภาพวาดบนผนัง จึงได้ชื่อว่า "หมู่บ้านภาพวาดไห่เฟิงหลุน"',
  id:'Desa terluas di kecamatan ini. Kuil Peilin memuliakan Tiga Raja Gunung (Sanshan Guowang) dan dibangun pada 1889. Gang-gang di kawasan Haifenglun dipenuhi mural, sehingga dijuluki "Desa Lukisan Haifenglun".',
  vi:'Làng có diện tích lớn nhất hương. Đền Peilin thờ Tam Sơn Quốc Vương (Sanshan Guowang), xây năm 1889. Các con hẻm ở khu Haifenglun phủ đầy tranh tường nên được gọi là "Làng bích họa Haifenglun".',
  ko:'향에서 면적이 가장 넓은 마을입니다. 페이린궁은 싼산궈왕(三山國王)을 모시며 1889년에 세워졌습니다. 하이펑룬 일대의 골목은 벽화로 가득해 \'하이펑룬 벽화마을\'이라 불립니다.',
  de:'Das flächenmäßig größte Dorf der Gemeinde. Der Peilin-Tempel ist den Drei Bergkönigen (Sanshan Guowang) geweiht und wurde 1889 erbaut. Die Gassen rund um Haifenglun sind voller Wandbilder – daher „Malerdorf Haifenglun“.' },
 '北鎮村': {
  ja:'北鎮と南鎮のあたりは、日本統治時代は「鎮平」（八大字のひとつ）に属していました。村には鎮平鎮安宮があります。',
  th:'พื้นที่เป่ยเจิ้นและหนานเจิ้นอยู่ใน "เจิ้นผิง" (หนึ่งในแปดตำบลเก่า) ในสมัยญี่ปุ่นปกครอง ในหมู่บ้านมีศาลเจ้าเจิ้นผิงเจิ้นอัน (鎮平鎮安宮)',
  id:'Beizhen dan Nanzhen pada masa pendudukan Jepang termasuk "Zhenping" (salah satu dari delapan wilayah lama). Di desa ini ada Kuil Zhenping Zhen\'an.',
  vi:'Beizhen và Nanzhen thời Nhật thuộc nằm trong "Zhenping" (một trong tám khu vực cũ). Trong làng có đền Zhenping Zhen\'an.',
  ko:'베이전과 난전 일대는 일제강점기에 \'전핑\'(옛 8대자 중 하나)에 속했습니다. 마을에는 전핑전안궁이 있습니다.',
  de:'Beizhen und Nanzhen gehörten in der japanischen Zeit zu „Zhenping“ (einem der acht alten Bezirke). Im Dorf steht der Zhenping-Zhen\'an-Tempel.' },
 '新興村': {
  ja:'村には福徳爺廟があり、土地公（土地の神）をまつっています。',
  th:'ในหมู่บ้านมีศาลฝูเต๋ออีเหมี่ยว (福德爺廟) บูชาเจ้าที่ (ถู่ตี้กง)',
  id:'Desa ini memiliki Kuil Fude Ye yang memuliakan Dewa Bumi (Tudigong).',
  vi:'Làng có miếu Phúc Đức Gia (Fude Ye), thờ Thổ Địa (Tudigong).',
  ko:'마을에는 푸더예먀오(福德爺廟)가 있으며 토지공(土地公)을 모십니다.',
  de:'Im Dorf steht der Fude-Ye-Tempel, der dem Erdgott (Tudigong) geweiht ist.' },
 '福田村': {
  ja:'郷の最東端にあり、社頭と田中に接しています。住民は稲と野菜を育てています。旧名は「小紅毛社」で、日本統治時代の八大字のひとつでした。',
  th:'อยู่ทางตะวันออกสุดของอำเภอ ติดกับเส้อโถวและเถียนจง ชาวบ้านปลูกข้าวและผัก ชื่อเดิมคือ "เสี่ยวหงเหมาเซ่อ" หนึ่งในแปดตำบลเก่าสมัยญี่ปุ่น',
  id:'Terletak di ujung timur kecamatan, berbatasan dengan Shetou dan Tianzhong. Warga menanam padi dan sayuran. Nama lamanya "Xiaohongmaoshe", salah satu dari delapan wilayah lama pada masa Jepang.',
  vi:'Nằm ở cực đông của hương, giáp Shetou và Tianzhong. Người dân trồng lúa và rau. Tên cũ là "Xiaohongmaoshe", một trong tám khu vực cũ thời Nhật thuộc.',
  ko:'향의 가장 동쪽에 있으며 서터우, 톈중과 맞닿아 있습니다. 주민들은 벼와 채소를 재배합니다. 옛 이름은 \'샤오훙마오서\'로 일제강점기의 8대자 중 하나였습니다.',
  de:'Am östlichen Rand der Gemeinde, angrenzend an Shetou und Tianzhong. Die Einwohner bauen Reis und Gemüse an. Der alte Name war „Xiaohongmaoshe“, einer der acht alten Bezirke der japanischen Zeit.' },
 '新生村': {
  ja:'國聖宮は新生村にあり、国姓爺（鄭成功）をまつっています。',
  th:'ศาลเจ้ากั๋วเซิ่ง (國聖宮) ตั้งอยู่ในหมู่บ้านซินเซิง บูชากั๋วซิ่งเหย (เจิ้งเฉิงกง)',
  id:'Kuil Guosheng berada di Desa Xinsheng dan memuliakan Koxinga (Zheng Chenggong).',
  vi:'Đền Guosheng nằm ở làng Xinsheng, thờ Quốc Tính Gia (Trịnh Thành Công – Koxinga).',
  ko:'궈성궁(國聖宮)은 신성촌에 있으며 궈싱예(國姓爺), 즉 정성공을 모십니다.',
  de:'Der Guosheng-Tempel steht in Xinsheng und ist Koxinga (Zheng Chenggong) geweiht.' },
 '南鎮村': {
  ja:'北鎮と南鎮のあたりは、日本統治時代は「鎮平」に属していました。南鎮国民小学校があり、住民の多くは農業を営んでいます。',
  th:'พื้นที่เป่ยเจิ้นและหนานเจิ้นอยู่ใน "เจิ้นผิง" ในสมัยญี่ปุ่นปกครอง โรงเรียนประถมหนานเจิ้นตั้งอยู่ที่นี่ และชาวบ้านส่วนใหญ่ทำเกษตร',
  id:'Nanzhen dan Beizhen pada masa Jepang termasuk "Zhenping". SD Nanzhen berada di sini, dan sebagian besar warga bertani.',
  vi:'Nanzhen và Beizhen thời Nhật thuộc nằm trong "Zhenping". Trường tiểu học Nanzhen ở đây và phần lớn người dân làm nông.',
  ko:'난전과 베이전 일대는 일제강점기에 \'전핑\'에 속했습니다. 난전 초등학교가 이곳에 있으며 주민 대부분이 농업에 종사합니다.',
  de:'Nanzhen und Beizhen gehörten in der japanischen Zeit zu „Zhenping“. Die Grundschule Nanzhen liegt hier, die meisten Einwohner betreiben Landwirtschaft.' },
 '睦宜村': {
  ja:'住民は稲作を営んでいます。聖德宮は天上聖母（媽祖）をまつり、毎年お祭り（廟会）が開かれます。',
  th:'ชาวบ้านปลูกข้าว ศาลเจ้าเซิ่งเต๋อ (聖德宮) บูชาเทียนซั่งเซิ่งหมู่ (หมาจู่) และจัดงานเทศกาลศาลเจ้าทุกปี',
  id:'Warga menanam padi. Kuil Shengde memuliakan Mazu dan menyelenggarakan perayaan kuil setiap tahun.',
  vi:'Người dân trồng lúa. Đền Shengde thờ Mazu và tổ chức lễ hội đền hằng năm.',
  ko:'주민들은 벼농사를 짓습니다. 성더궁(聖德宮)은 마조를 모시며 해마다 묘회 축제를 엽니다.',
  de:'Die Einwohner bauen Reis an. Der Shengde-Tempel ist Mazu geweiht und veranstaltet jährlich ein Tempelfest.' },
};
