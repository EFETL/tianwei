/* ================= 幾何：點在多邊形內、距邊界、撒點 ================= */
function pip(poly, x, z){ let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const [xi, zi] = poly[i], [xj, zj] = poly[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; }
function edgeDist(poly, x, z){
  let best = 1e9;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [ax, az] = poly[j], [bx, bz] = poly[i], dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz || 1;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1), px = ax + t * dx, pz = az + t * dz;
    best = Math.min(best, Math.hypot(x - px, z - pz));
  }
  return best;
}
function bounds(poly){ let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, z] of poly){ a = Math.min(a, x); b = Math.min(b, z); c = Math.max(c, x); d = Math.max(d, z); } return [a, b, c, d]; }
function polyArea(p){ let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]); return Math.abs(a / 2); }
const free = (x, z, occ, pad = 0) => occ.every(o => Math.hypot(x - o[0], z - o[1]) > o[2] + pad);
function lattice(poly, step, rnd, occ, margin = .12, jitter = .3){
  const [x0, z0, x1, z1] = bounds(poly), out = [];
  for (let z = z0 + step / 2; z < z1; z += step) for (let x = x0 + step / 2; x < x1; x += step){
    const px = x + (rnd() - .5) * step * jitter, pz = z + (rnd() - .5) * step * jitter;
    if (pip(poly, px, pz) && edgeDist(poly, px, pz) > margin && free(px, pz, occ)) out.push([px, pz]);
  }
  return out;
}
function scatter(poly, n, minD, rnd, occ, margin = .2){
  const [x0, z0, x1, z1] = bounds(poly), out = [];
  for (let t = 0; t < n * 40 && out.length < n; t++){
    const x = lerp(x0, x1, rnd()), z = lerp(z0, z1, rnd());
    if (!pip(poly, x, z) || edgeDist(poly, x, z) < margin || !free(x, z, occ)) continue;
    if (out.every(q => Math.hypot(q[0] - x, q[1] - z) > minD)) out.push([x, z]);
  }
  return out;
}

function buildVillage(name){
  const P = POLY[name], info = INFO[name] || {};
  const pole = toW(P.pole), rpx = P.r * S;
  const poly = P.pts.map(p => { const w = toW(p); return [w[0] - pole[0], w[1] - pole[1]]; });
  const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: SKIRT, bevelEnabled: false }); geo.rotateX(-Math.PI / 2); geo.translate(0, -SKIRT, 0);
  const topMat = new THREE.MeshStandardMaterial({ color: info.top || 0xa7d18a, flatShading: true, roughness: .95 });
  const mesh = shade(new THREE.Mesh(geo, [topMat, M(0xb98c5e)]));
  const g = new THREE.Group(); g.position.set(pole[0], 0, pole[1]); g.add(mesh);
  const rnd = mulberry32(hashStr(name));
  const content = new THREE.Group(); g.add(content);
  // 英雄場景
  const occ = [], sc = clamp(rpx * .95 / .9, .5, 1.45);
  if (info.hero && HERO[info.hero]){
    const h = new THREE.Group(); h.scale.setScalar(sc); HERO[info.hero](h, rnd); content.add(h);
    occ.push([0, 0, .95 * sc]);
  }
  // 田野／房屋
  for (const f of (info.fill || [])){ const [kind, opt] = Array.isArray(f) ? f : [f, null]; if (FILL[kind]) FILL[kind](content, poly, rnd, occ, { ...info, ...(opt || {}) }); }
  world.add(g);
  const v = { name, info, group: g, mesh, topMat, content, poly, pole, pos: new THREE.Vector3(pole[0], 0, pole[1]), y: 0, r: rpx, baseTop: new THREE.Color(info.top || 0xa7d18a) };
  mesh.userData.village = name;
  villages.push(v);
  return v;
}

}
fetch('news.json').then(r => r.ok ? r.json() : { items: [] }).then(j => {
  const today = ymd(new Date()), all = new URLSearchParams(location.search).has('news');
  NEWS = (j.items || []).filter(it => all || (it.start <= today && today <= it.end));
  renderNews(); NEWS.forEach(addBanner);
}).catch(() => {});
function applyLang(){
  const u = UI[LANG];
  $('tSub').textContent = u.sub; $('dLbl').textContent = u.dist; $('rLbl').textContent = u.reset; $('hLbl').textContent = u.home;
  distBtn.title = u.tDist; nightBtn.title = u.tNight; $('resetBtn').title = u.tReset; $('homeBtn').title = u.tHome; dockEl.setAttribute('aria-label', u.list);
  $('noglBox').innerHTML = `<h2>${u.glH}</h2><p>${u.glP}</p>`;
  setNightLabel(); renderLegend(); renderNames(); renderNews(); if (selected) fillPanel(selected);
}
const langSel = $('langSel');
langSel.innerHTML = Object.entries(LANGS).map(([k, n]) => `<option value="${k}">${n}</option>`).join(''); langSel.value = LANG;
langSel.onchange = () => { LANG = langSel.value; try { localStorage.setItem('tw-lang', LANG); } catch (e) {} applyLang(); };
applyLang();
const qs = new URLSearchParams(location.search);
if (qs.has('night')) setNight(true);
if (qs.has('dist')) setDist(true);
if (UI[qs.get('lang')]) { LANG = qs.get('lang'); langSel.value = LANG; applyLang(); }

/* ================= 點選／懸停 ================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downX = 0, downY = 0;
function pickVillage(e){
  const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(villages.map(v => v.mesh), false)[0]; return hit ? hit.object.userData.village : null;
}
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse'){ hoverName = pickVillage(e); stage.classList.toggle('hover', !!hoverName); } });
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => { if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; const n = pickVillage(e); if (n) select(n); });

/* ================= 主迴圈 ================= */
const v3 = new THREE.Vector3(), tc = new THREE.Color();
function applyNight(n){
  scene.background.copy(DAY.bg).lerp(NIGHT.bg, n); scene.fog.color.copy(scene.background); ground.material.color.copy(DAY.ground).lerp(NIGHT.ground, n);
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n); sun.intensity = lerp(2.2, .8, n);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, n); hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, n); hemi.intensity = lerp(.95, 1.25, n);
  bulbMat.emissiveIntensity = n * 3; winMat.emissiveIntensity = .05 + n * 1.6; lanternMat.emissiveIntensity = .2 + n * 1.8; chrysMat.emissiveIntensity = n * .35;
  lampCones.forEach(c => c.material.opacity = n * .22); nightLights.forEach(o => o.light.intensity = n * o.k);
  starMat.opacity = n; moon.material.opacity = n; cloudMat.opacity = lerp(.9, .12, n);
  const ld = $('loading'); if (ld) ld.style.background = scene.background.getStyle();
}
const clock = new THREE.Clock(); let T = 0, shiftX = 0, shiftY = 0;
applyNight(0); resize(); resetView();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); T += dt; uTime.value = T;
  if (Math.abs(nightV - nightGoal) > .001){ nightV += (nightGoal - nightV) * Math.min(1, dt * 3); applyNight(nightV); }
  if (!calm) swayers.forEach(g => g.rotation.x = Math.sin(T * 1.5 + g.userData.phase) * g.userData.amp);
  anim.forEach(f => f(T, dt));
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 34) c.position.x = -34; });
  birds.forEach(o => { const a = T * o.sp + o.ph; o.b.position.set(Math.cos(a) * o.rad, o.h + Math.sin(T * 1.2 + o.ph) * .3, Math.sin(a) * o.rad * .6); o.b.rotation.y = -a + Math.PI; const f = Math.sin(T * 9 + o.ph) * .7; o.L.rotation.z = f; o.Rr.rotation.z = -f; });
  for (const v of villages){ const goal = v.name === selected ? .22 : v.name === hoverName ? .12 : 0; v.y += (goal - v.y) * Math.min(1, dt * 10); v.group.position.y = v.y; }
  if (tweening){
    const off = v3.copy(camera.position).sub(controls.target);
    controls.target.lerp(goalTarget, Math.min(1, dt * 3.2)); off.setLength(lerp(off.length(), goalDist, Math.min(1, dt * 3.2))); camera.position.copy(controls.target).add(off);
  }
  const W_ = innerWidth, H_ = innerHeight, narrow = W_ <= 760, open = panel.classList.contains('open');
  const wantX = open && !narrow ? W_ * .17 : 0, wantY = open && narrow ? H_ * .2 : 0;
  shiftX += (wantX - shiftX) * Math.min(1, dt * 6); shiftY += (wantY - shiftY) * Math.min(1, dt * 6);
  if (Math.abs(shiftX) + Math.abs(shiftY) > .5) camera.setViewOffset(W_, H_, shiftX, shiftY, W_, H_); else if (camera.view) camera.clearViewOffset();
  controls.update();
  if (!narrow) for (const v of villages){ tmp.copy(v.pos).add(v3.set(0, .55, 0)).project(camera); const el = chipMap.get(v.name).chip; el.classList.toggle('hidden', tmp.z > 1); el.style.transform = `translate(${(tmp.x * .5 + .5) * W_}px,${(-tmp.y * .5 + .5) * H_}px) translate(-50%,-100%)`; }
  renderer.render(scene, camera);
  if (T > .3 && !frame.done){ frame.done = true; $('loading').classList.add('done'); setTimeout(() => $('loading') && $('loading').remove(), 800); }
}
if (SLUG_REV[START_HASH]) select(SLUG_REV[START_HASH]);
frame();
if (qs.has('shot')){ document.body.classList.add('shot'); controls.autoRotate = false; clouds.forEach(c => c.visible = false); birds.forEach(o => o.b.visible = false); }
window.__shot = (name) => {   // 產生「3D 示意圖」用：把鏡頭擺到某個村，其餘村先隱藏
  const v = byName[name]; selected = name; v.y = .22; v.group.position.y = .22; panel.classList.remove('open');
  for (const o of villages){ o.group.visible = o === v; }
  const bb = bounds(v.poly), dx = bb[2] - bb[0], dz = bb[3] - bb[1], asp = Math.min(camera.aspect, 1.78), dW = (dx * .9 + dz * .5 + .3) * 1.15 / (.63 * asp), dH = (dz * .8 + dx * .3 + 1) * 1.15 / .63, d = clamp(Math.max(dW, dH) * .76, 2.2, 22);
  const ctr = new THREE.Vector3(v.pos.x + (bb[0] + bb[2]) / 2, -.3, v.pos.z + (bb[1] + bb[3]) / 2);
  goalTarget.copy(ctr); controls.target.copy(ctr);
  camera.position.copy(ctr).add(new THREE.Vector3(.5, .78, 1).normalize().multiplyScalar(d)); tweening = false; controls.update();
};
if (qs.get('shot')){ const sn = qs.get('shot'); const go = () => { if (byName[sn]) window.__shot(sn); }; setTimeout(go, 300); setTimeout(go, 1500); }
window.__tw = { select, setNight, setDist, scene, camera, controls, villages, dbg: () => ({ goalDist, tweening, T }) };
</script>
