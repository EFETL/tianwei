};
FILL.veg = (g, poly, rnd, occ) => {
  const pts = lattice(poly, .16, rnd, occ, .1), items = [], pal = [0x6fbf5a, 0x8ccf6a, 0x4fa05a, 0xb8d96a, 0x9a6fc0];
  pts.forEach(([x, z]) => items.push({ p: [x, .05, z], s: [.06, .05, .06], c: pal[Math.floor((z + 60) * 3) % pal.length] }));
  g.add(inst(headGeo, M(0xffffff), items));
};
FILL.orchard = (g, poly, rnd, occ, v) => {
  const pts = scatter(poly, clamp(Math.round(polyArea(poly) * 1.1), 6, 150), .34, rnd, occ, .22), tr = [], c1 = [], c2 = [], fr = [];
  pts.forEach(([x, z]) => { const s = .75 + rnd() * .5; tr.push({ p: [x, .07 * s, z], s: [s, s, s] }); c1.push({ p: [x, .2 * s, z], s: [.14 * s, .2 * s, .14 * s], c: [0x3f8f55, 0x4aa05e, 0x2f7a49][Math.floor(rnd() * 3)] }); c2.push({ p: [x, .34 * s, z], s: [.1 * s, .16 * s, .1 * s], c: 0x4aa05e }); if (v && v.fruit) fr.push({ p: [x + .05 * s, .22 * s, z + .04 * s], s: .025, c: v.fruit }); });
  g.add(inst(new THREE.CylinderGeometry(.025, .035, .14, 5), M(0x8a5a36), tr), inst(new THREE.ConeGeometry(1, 1, 6), W(0xffffff, .02), c1), inst(new THREE.ConeGeometry(1, 1, 6), W(0xffffff, .02), c2));
  if (fr.length) g.add(inst(headGeo, M(0xffffff), fr));
};
FILL.houses = (g, poly, rnd, occ, v) => {
  const n = v && v.houses ? v.houses : 6, pts = scatter(poly, n, .5, rnd, occ, .25), walls = [], roofs = [], pal = [0xf4a6c0, 0xf3c04a, 0x7ec8c0, 0xe08a6a, 0xa9d28b, 0xf1ece0], rp = [0xb4553f, 0x4a7fa8, 0x5a6f8a];
  pts.forEach(([x, z]) => { const w = .2 + rnd() * .1, d = .18 + rnd() * .08, h = .13 + rnd() * .08, ry = Math.floor(rnd() * 4) * Math.PI / 2 + (rnd() - .5) * .3;
    walls.push({ p: [x, h / 2, z], s: [w, h, d], ry, c: pal[Math.floor(rnd() * pal.length)] }); roofs.push({ p: [x, h + w * .12, z], s: [w * .74, w * .74, d + .03], ry, rz: Math.PI / 4, c: rp[Math.floor(rnd() * 3)] }); occ.push([x, z, .24]);
    const win = new THREE.Mesh(new THREE.PlaneGeometry(.05, .05), winMat); win.position.set(x + Math.sin(ry) * (d / 2 + .003), h * .55, z + Math.cos(ry) * (d / 2 + .003)); win.rotation.y = ry; g.add(win); });
  const rf = inst(new THREE.BoxGeometry(1, 1, 1), M(0xffffff), roofs);
  g.add(inst(new THREE.BoxGeometry(1, 1, 1), M(0xffffff), walls), rf);
};
FILL.trees = (g, poly, rnd, occ) => FILL.orchard(g, poly, rnd, occ, {});

/* ================= 組裝 20 個村 ================= */
const world = new THREE.Group(); scene.add(world);
const villages = [];
const SKIRT = .7;
function buildVillage(name){
  const P = POLY[name], info = INFO[name] || {};
  const pole = toW(P.pole), rpx = P.r * S;
  const poly = P.pts.map(p => { const w = toW(p); return [w[0] - pole[0], w[1] - pole[1]]; });
  const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: SKIRT, bevelEnabled: false }); geo.rotateX(-Math.PI / 2); geo.translate(0, -SKIRT, 0);
  const topMat = new THREE.MeshStandardMaterial({ color: info.top || 0xa7d18a, flatShading: true, roughness: .95 });
  const mesh = shade(new THREE.Mesh(geo, [topMat, M(0xb98c5e)]));
  const g = new THREE.Group(); g.position.set(pole[0], 0, pole[1]); g.add(mesh);
  const rnd = mulberry32(hashStr(name));
  const content = new THREE.Group(); g.add(content);
  // 英雄場景
  const occ = [], sc = clamp(rpx * .95 / .9, .5, 1.45);
  if (info.hero && HERO[info.hero]){
    const h = new THREE.Group(); h.scale.setScalar(sc); HERO[info.hero](h, rnd); content.add(h);
    occ.push([0, 0, .95 * sc]);
  }
  // 田野／房屋
  for (const f of (info.fill || [])){ const [kind, opt] = Array.isArray(f) ? f : [f, null]; if (FILL[kind]) FILL[kind](content, poly, rnd, occ, { ...info, ...(opt || {}) }); }
  world.add(g);
  const v = { name, info, group: g, mesh, topMat, poly, pole, pos: new THREE.Vector3(pole[0], 0, pole[1]), y: 0, r: rpx, baseTop: new THREE.Color(info.top || 0xa7d18a) };
  mesh.userData.village = name;
  villages.push(v);
  return v;
}
for (const name of Object.keys(POLY)) if (!name.startsWith('_')) buildVillage(name);
const byName = Object.fromEntries(villages.map(v => [v.name, v]));

/* ================= 底座、雲、鳥、星空 ================= */
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: DAY.ground, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -SKIRT - .02; ground.receiveShadow = true; scene.add(ground);
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: .9, roughness: 1 });
const clouds = [], crnd = mulberry32(99);
for (let i = 0; i < 7; i++){ const c = new THREE.Group(); for (let k = 0; k < 4; k++){ const b = new THREE.Mesh(new THREE.IcosahedronGeometry(.9 + crnd() * .6, 1), cloudMat); b.position.set(k * 1.1 - 1.6, crnd() * .4, crnd() * .7); b.scale.y = .55; c.add(b); }
  c.position.set(-30 + i * 9, 13 + crnd() * 4, -22 + crnd() * 44); c.scale.setScalar(.6); c.userData.v = .3 + crnd() * .3; scene.add(c); clouds.push(c); }
const birds = [];
for (let i = 0; i < 7; i++){
  const b = new THREE.Group(), wl = new THREE.Mesh(new THREE.PlaneGeometry(.5, .22), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })), wr = wl.clone();
  wl.position.x = -.25; wr.position.x = .25; const L = new THREE.Group(), Rr = new THREE.Group(); L.add(wl); Rr.add(wr); b.add(L, Rr); scene.add(b); birds.push({ b, L, Rr, ph: i * 1.3, rad: 6 + i * 1.6, sp: .18 + i * .015, h: 4.2 + (i % 3) * .7 });
}
const starGeo = new THREE.BufferGeometry(), sp = [], srnd = mulberry32(5);
for (let i = 0; i < 420; i++){ const a = srnd() * 6.28, e = srnd() * 1.1 + .15, r = 120; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: .8, transparent: true, opacity: 0, depthWrite: false, fog: false }); scene.add(new THREE.Points(starGeo, starMat));
const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 20, 14), new THREE.MeshBasicMaterial({ color: 0xfff6d8, transparent: true, opacity: 0, fog: false })); moon.position.set(-70, 60, -90); scene.add(moon);

/* ================= 相機 ================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.enablePan = false;
controls.minPolarAngle = .3; controls.maxPolarAngle = 1.3; controls.minDistance = 5; controls.maxDistance = 90;
controls.autoRotate = !calm; controls.autoRotateSpeed = .35;
const startDir = new THREE.Vector3(.15, .95, 1).normalize();
const goalTarget = new THREE.Vector3(), tmp = new THREE.Vector3();
let goalDist = 30, tweening = true;
const defaultDist = () => clamp(29 / (.63 * innerWidth / innerHeight), 21, 80);
camera.position.copy(startDir).multiplyScalar(defaultDist() * 1.9);
controls.addEventListener('start', () => { tweening = false; controls.autoRotate = false; });
function resetView(){ goalTarget.set(0, 0, 0); goalDist = defaultDist(); tweening = true; controls.autoRotate = !calm; select(null); }
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (tweening && !selected) goalDist = defaultDist(); }
addEventListener('resize', resize);

/* ================= 介面 ================= */
const chipsEl = document.getElementById('chips'), dockEl = document.getElementById('dock'), panel = document.getElementById('panel');
const $ = id => document.getElementById(id);
const chipMap = new Map();
const order = villages.slice().sort((a, b) => (INFO[a.name]?.dist || 9) - (INFO[b.name]?.dist || 9));
for (const v of order){
  const emo = v.info.emoji || '📍';
  const chip = document.createElement('button'); chip.className = 'chip'; chip.textContent = `${emo} ${v.name.replace('村', '')}`; chip.onclick = () => select(v.name); chipsEl.appendChild(chip);
  const d = document.createElement('button'); d.className = 'btn card'; d.textContent = `${emo} ${v.name}`; d.onclick = () => select(v.name); dockEl.appendChild(d);
  chipMap.set(v.name, { chip, d });
}
let selected = null, hoverName = null, showDist = false;
function select(name){
  selected = name;
  for (const [k, c] of chipMap){ c.chip.classList.toggle('on', k === name); c.d.classList.toggle('on', k === name); }
  if (!name){ panel.classList.remove('open'); try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {} return; }
  const v = byName[name], i = v.info, dd = DIST[i.dist];
  $('pEmoji').textContent = i.emoji || '📍'; $('pZh').textContent = name; $('pEn').textContent = i.en || '';
  const tag = $('pTag'); tag.textContent = dd ? dd.name : ''; tag.style.background = dd ? '#' + dd.c.toString(16).padStart(6, '0') : '#888'; tag.hidden = !dd;
  $('pText').textContent = i.text || ''; $('pEnText').textContent = i.enText || ''; $('pMeta').textContent = i.meta || ''; $('pMeta').hidden = !i.meta;
  $('pSrc').innerHTML = '3D 場景為示意。人口：內政部戶政司 115 年 9 月；文字已逐句核對公開資料（鄉公所官網的村頁目前無法開啟）。';
  $('pPage').href = `village/${SLUG[name]}.html`; try { history.replaceState(null, '', '#' + SLUG[name]); } catch (e) {}
  panel.classList.add('open');
  goalTarget.copy(v.pos); goalDist = clamp(v.r * 7 + 9, 11, defaultDist() * .55); tweening = true; controls.autoRotate = false;
}
$('closeBtn').onclick = () => select(null);
$('resetBtn').onclick = resetView;
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
const nightBtn = $('nightBtn');
function setNight(on){ nightGoal = on ? 1 : 0; document.body.classList.toggle('night', on); nightBtn.setAttribute('aria-pressed', String(on)); nightBtn.innerHTML = on ? '☀️ <span class="lbl">白天</span>' : '🌙 <span class="lbl">夜晚</span>'; }
nightBtn.onclick = () => setNight(!nightGoal);
const distBtn = $('distBtn'), legend = $('legend');
legend.innerHTML = Object.values(DIST).map(d => `<div><i style="background:#${d.c.toString(16).padStart(6, '0')}"></i>${d.name}</div>`).join('');
function setDist(on){ showDist = on; distBtn.setAttribute('aria-pressed', String(on)); legend.classList.toggle('show', on); for (const v of villages){ const dd = DIST[v.info.dist]; v.topMat.color.set(on && dd ? dd.c : v.baseTop); } }
distBtn.onclick = () => setDist(!showDist);
const qs = new URLSearchParams(location.search);
if (qs.has('night')) setNight(true);
if (qs.has('dist')) setDist(true);

/* ================= 點選／懸停 ================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downX = 0, downY = 0;
function pickVillage(e){
  const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(villages.map(v => v.mesh), false)[0]; return hit ? hit.object.userData.village : null;
}
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType === 'mouse'){ hoverName = pickVillage(e); stage.classList.toggle('hover', !!hoverName); } });
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => { if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; const n = pickVillage(e); if (n) select(n); });

/* ================= 主迴圈 ================= */
const v3 = new THREE.Vector3(), tc = new THREE.Color();
function applyNight(n){
  scene.background.copy(DAY.bg).lerp(NIGHT.bg, n); scene.fog.color.copy(scene.background); ground.material.color.copy(DAY.ground).lerp(NIGHT.ground, n);
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n); sun.intensity = lerp(2.2, .8, n);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, n); hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, n); hemi.intensity = lerp(.95, 1.25, n);
  bulbMat.emissiveIntensity = n * 3; winMat.emissiveIntensity = .05 + n * 1.6; lanternMat.emissiveIntensity = .2 + n * 1.8; chrysMat.emissiveIntensity = n * .35;
  lampCones.forEach(c => c.material.opacity = n * .22); nightLights.forEach(o => o.light.intensity = n * o.k);
  starMat.opacity = n; moon.material.opacity = n; cloudMat.opacity = lerp(.9, .12, n);
  const ld = $('loading'); if (ld) ld.style.background = scene.background.getStyle();
}
const clock = new THREE.Clock(); let T = 0, shiftX = 0, shiftY = 0;
applyNight(0); resize(); resetView();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); T += dt; uTime.value = T;
  if (Math.abs(nightV - nightGoal) > .001){ nightV += (nightGoal - nightV) * Math.min(1, dt * 3); applyNight(nightV); }
  if (!calm) swayers.forEach(g => g.rotation.x = Math.sin(T * 1.5 + g.userData.phase) * g.userData.amp);
  anim.forEach(f => f(T, dt));
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 34) c.position.x = -34; });
  birds.forEach(o => { const a = T * o.sp + o.ph; o.b.position.set(Math.cos(a) * o.rad, o.h + Math.sin(T * 1.2 + o.ph) * .3, Math.sin(a) * o.rad * .6); o.b.rotation.y = -a + Math.PI; const f = Math.sin(T * 9 + o.ph) * .7; o.L.rotation.z = f; o.Rr.rotation.z = -f; });
  for (const v of villages){ const goal = v.name === selected ? .22 : v.name === hoverName ? .12 : 0; v.y += (goal - v.y) * Math.min(1, dt * 10); v.group.position.y = v.y; }
  if (tweening){
    const off = v3.copy(camera.position).sub(controls.target);
    controls.target.lerp(goalTarget, Math.min(1, dt * 3.2)); off.setLength(lerp(off.length(), goalDist, Math.min(1, dt * 3.2))); camera.position.copy(controls.target).add(off);
  }
  const W_ = innerWidth, H_ = innerHeight, narrow = W_ <= 760, open = panel.classList.contains('open');
  const wantX = open && !narrow ? W_ * .17 : 0, wantY = open && narrow ? H_ * .2 : 0;
  shiftX += (wantX - shiftX) * Math.min(1, dt * 6); shiftY += (wantY - shiftY) * Math.min(1, dt * 6);
  if (Math.abs(shiftX) + Math.abs(shiftY) > .5) camera.setViewOffset(W_, H_, shiftX, shiftY, W_, H_); else if (camera.view) camera.clearViewOffset();
  controls.update();
  if (!narrow) for (const v of villages){ tmp.copy(v.pos).add(v3.set(0, .55, 0)).project(camera); const el = chipMap.get(v.name).chip; el.classList.toggle('hidden', tmp.z > 1); el.style.transform = `translate(${(tmp.x * .5 + .5) * W_}px,${(-tmp.y * .5 + .5) * H_}px) translate(-50%,-100%)`; }
  renderer.render(scene, camera);
  if (T > .3 && !frame.done){ frame.done = true; $('loading').classList.add('done'); setTimeout(() => $('loading') && $('loading').remove(), 800); }
}
if (SLUG_REV[START_HASH]) select(SLUG_REV[START_HASH]);
frame();
window.__tw = { select, setNight, setDist, scene, camera, controls, villages, dbg: () => ({ goalDist, tweening, T }) };
</script>
</body>
</html>
